# 不玩游戏 Windows 打包（安装版 + 便携版）
# 仅 workflow_dispatch 手动触发——push/PR 永不自动打包（关卡 A 审批约束，返修 P0-2）
# 产物以 artifact 形式上传；正式 Release 由人工审核后手动发布
name: package

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Package Windows (installer + portable)
        run: npm run dist
        env:
          # electron-builder 下载 Electron 二进制使用 npmmirror 国内镜像加速；
          # GitHub runner 访问官方源更快时可直接删除此环境变量
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            client/release/*.exe
            client/release/latest.yml
          if-no-files-found: error
          retention-days: 14
